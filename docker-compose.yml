services:
  dissuasore:
    # Immagine pronta costruita da GitHub Actions (arm/v7, arm64, amd64).
    # Per costruirla in locale sul Pi: commenta "image" e togli il commento a "build".
    image: ghcr.io/land2595/dissuasore-piccioni:latest
    # build: .
    container_name: dissuasore-piccioni
    restart: unless-stopped
    ports:
      - "8080:8080"
    devices:
      - /dev/snd:/dev/snd        # accesso all'uscita audio (jack delle cuffie)
    group_add:
      - audio
    volumes:
      - ./data:/data              # suoni, impostazioni e registro restano qui
    environment:
      - TZ=Europe/Rome            # le fasce orarie usano questo fuso
      # Protezione con password (facoltativa): togli il commento e scegli le credenziali
      # - WEB_USER=admin
      # - WEB_PASSWORD=cambiami
      # - MAX_UPLOAD_MB=20
